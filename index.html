<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vegas Poker Planner — redirecting to the current dashboard</title>
<!--
  This file is a redirect, not a dashboard.

  It used to be a full research page from an earlier round (46 Venetian rows,
  no verified hotel cost). The canonical dashboard — 341 source-linked rows, the
  dated hotel rate log, the day plan and the Flagged for review register — lives
  in site/ and is published at /Poker3/site/.

  Leaving the old page here meant the repository's root URL served conclusions
  that the live dashboard contradicts, depending on which of the two GitHub Pages
  publishers won the last race. Redirecting removes that possibility whichever
  publisher is serving. The old content is not deleted: it is in version control
  as index.html before this commit, and its successor is site/index.html.

  No-JavaScript fallback: a refresh to /Poker3/site/ plus a visible link.
-->
<link rel="canonical" href="site/index.html">
<meta http-equiv="refresh" content="0; url=site/index.html">
<style>
  :root{color-scheme:dark light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
  main{max-width:34rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .5rem;font-weight:650}
  p{margin:.5rem 0;color:#9aa7b4}
  a{color:#6ea8fe}
  .note{font-size:.85rem;margin-top:1.5rem;color:#7d8896}
</style>
</head>
<body>
<main>
  <h1>Opening the Vegas Poker Planner</h1>
  <p>The current dashboard is loading. If nothing happens,
     <a href="site/index.html">open the dashboard</a>.</p>
  <p class="note">Every value there links the official venue page it was read from. Blank cells are
     unverified values, listed on the Flagged for review page.</p>
</main>
<script>location.replace('site/index.html' + location.hash);</script>
</body>
</html>
