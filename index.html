<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vegas Poker Planner</title>
  <link rel="canonical" href="site/">
  <meta http-equiv="refresh" content="0; url=site/">
  <style>
    :root{--ink:#182b3a;--muted:#607180;--paper:#f4f7f8;--teal:#087f78;--line:#dce5e8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
      font:16px/1.6 'DM Sans',Arial,sans-serif}
    .card{max-width:560px;padding:40px 34px;text-align:center}
    .badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--teal);
      border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:#fff}
    h1{font-family:Manrope,'DM Sans',sans-serif;font-size:30px;margin:18px 0 8px}
    p{color:var(--muted);margin:6px 0 22px}
    a.btn{display:inline-block;background:var(--teal);color:#fff;text-decoration:none;
      padding:12px 22px;border-radius:10px;font-weight:700}
    a.btn:hover{filter:brightness(1.05)}
    .small{margin-top:16px;font-size:13px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">LAS VEGAS · DECISION DASHBOARD</span>
    <h1>Vegas Poker Planner</h1>
    <p>You are being redirected to the canonical dashboard, which carries the full, source-linked tournament, hotel and schedule data.</p>
    <a class="btn" href="site/">Open the dashboard &rarr;</a>
    <p class="small">If you are not redirected automatically, use the button above.</p>
  </main>
</body>
</html>
