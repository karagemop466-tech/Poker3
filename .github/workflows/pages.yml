name: Publish the canonical Vegas Poker Planner to GitHub Pages

# Legacy branch deployments may still serve the repository root. Keep the
# canonical site available at both /Poker3/ and /Poker3/site/ when this artifact
# wins, so existing bookmarks keep working whichever publisher finishes last.
# Scheduled jobs commit with GITHUB_TOKEN, which does not reliably fan out to
# push-triggered workflows. Watch their completion explicitly and check out
# main at build time, not the commit before the scheduled job wrote its record.
on:
  push:
    branches: [main]
  workflow_run:
    workflows:
      - Scheduled source re-check and daily room feed
      - Daily official-source monitor and site refresh
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A distinct group from the legacy deployment's, so the two never cancel each
  # other; the last deployment to finish is the one served.
  group: pages-actions
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workflow validation dependency
        run: python3 -m pip install 'PyYAML==6.0.3'

      # Publication must not race an independent verification workflow. These
      # offline checks validate recorded evidence, not live source availability;
      # missing evidence remains flagged and is not promoted to verified here.
      - name: Validate recorded evidence and local links before publication
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_951cd431.py
          python3 scripts/verify_live_official.py
          python3 scripts/audit_data.py
          python3 scripts/verify_entry_labels.py

      - name: Run regression and rendered-dashboard checks before publication
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/canonical_smoke.py
          node tests/canonical_render.js
          node --check site/assets/app.js
          node --check site/assets/venue.js
          node --check site/assets/search.js
          node --check site/assets/feed.js

      - name: Stage both public dashboard paths
        run: |
          cp -a site _pages
          cp -a site _pages/site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the canonical dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
