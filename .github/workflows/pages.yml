name: Publish integrated Vegas Poker Planner to GitHub Pages

on:
  push:
    branches: [main]
  # The repository also has GitHub's legacy branch deployment ("pages build and
  # deployment") enabled, which publishes the repository root. Re-running the
  # Actions deployment after that job finishes makes the canonical site/ artifact
  # the one served at the site root.
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A different group from the legacy deployment's, so the two deployments do not
  # cancel each other; the last one to finish is the one that is served.
  group: pages-actions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload published dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
