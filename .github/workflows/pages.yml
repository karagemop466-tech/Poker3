name: Publish the canonical Vegas Poker Planner to GitHub Pages

# End state this workflow guarantees: the published site is the canonical
# dashboard in site/, served at the repository's Pages root (…/Poker3/), with the
# site/poker3/ archive beside it at /poker3/.
#
# Why the workflow_run trigger: the repository's Pages source is the legacy
# "deploy from a branch: main / (root)" setting, and the API token available to
# this session cannot change it (PUT /pages returns 403). Under that setting
# GitHub's own "pages build and deployment" job republishes the whole repository
# after every push, which would otherwise put the stale root-level index.html
# back at the root URL. Re-running this deployment after that job finishes keeps
# the verified artifact as the site that is actually served.
#
# The root-level index.html in the repository is also a redirect to site/, so the
# root URL reaches the canonical dashboard even if the legacy build wins a race.
# It is therefore never possible for a visitor to land on the stale page.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A distinct group from the legacy deployment's, so the two never cancel each
  # other; the last deployment to finish is the one served.
  group: pages-actions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workflow validation dependency
        run: python3 -m pip install 'PyYAML==6.0.3'

      # Publication must not race an independent verification workflow. These
      # offline checks validate recorded evidence, not live source availability;
      # missing evidence remains flagged and is not promoted to verified here.
      - name: Validate recorded evidence and local links before publication
        run: |
          python3 scripts/verify_site.py
          python3 scripts/audit_951cd431.py
          python3 scripts/verify_live_official.py
          python3 scripts/audit_data.py
          python3 scripts/verify_entry_labels.py

      - name: Run regression and rendered-dashboard checks before publication
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/canonical_smoke.py
          node tests/canonical_render.js
          node --check site/assets/app.js
          node --check site/assets/venue.js
          node --check site/assets/search.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the canonical dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
