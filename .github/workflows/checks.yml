name: Scheduled source re-check and daily room feed

on:
  schedule:
    # 05:00 Pacific every morning: re-read every official URL, then pull the
    # morning schedule feed for each Strip poker room.
    - cron: "13 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-checks
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-check every official URL behind the dashboard
        run: python3 scripts/check_sources.py

      - name: Fetch the morning daily schedule feed for each Strip poker room
        run: python3 scripts/daily_feed.py

      - name: Verify the dashboard still passes its own checks
        run: |
          python3 scripts/verify_site.py
          node --check site/assets/app.js
          python3 -m json.tool site/data.json > /dev/null
          python3 -m json.tool site/checks.json > /dev/null
          python3 -m json.tool site/feed/index.json > /dev/null

      - name: Publish the check results and the feed when they changed
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/checks.json site/feed
          if git diff --cached --quiet; then
            echo "No change in the checked sources."
            exit 0
          fi
          git commit -m "chore: record official source re-check and daily room feed ($(date -u +%Y-%m-%d))"
          git push
