name: Scheduled source re-check and daily room feed

# The single scheduled job that re-checks every official URL behind the
# dashboard. It is the only scheduled writer (source-monitor.yml only refreshes
# the archived site/poker3 companion) and it shares one concurrency group, so two
# runs can never delete each other's record in a branch race.
#
# Why this file was rewritten (2026-11-17): the previous version ran
# `python3 scripts/verify_site.py` and `json.tool site/checks.json` BEFORE the
# step that creates checks.json. On the first run checks.json does not exist, so
# the job would have failed at the verify step and never written or published the
# record it exists to produce. The old checker also treated a single unreachable
# optional PDF as fatal for the whole record. Both were repaired:
#   * scripts/check_sources.py records the state of every URL, including the ones
#     it could not reach, so the record always exists and a failure is published
#     as "unavailable" rather than as a content change;
#   * scripts/verify_transcription.py then re-checks the 44 transcribed series-PDF
#     rows against the published data and records the result beside it;
#   * the dashboard verifier runs last, after both records exist.
#
# It only records observations. It never rewrites a tournament, fee, hotel or
# guarantee value: a changed page is flagged for a human to re-read.

on:
  push:
    branches: [main]
    paths:
      # Run as soon as the job, the data it reads or the dashboard changes, so
      # the published change record is never older than the content it
      # describes. It also gives the job its first real run: a cron that has
      # never fired leaves site/checks.json absent, and the Actions token cannot
      # dispatch this workflow by hand (POST /dispatches returns 403).
      #
      # site/checks.json and site/feed/** are deliberately absent: this job
      # writes them, so including them would make it trigger itself.
      - '.github/workflows/checks.yml'
      - 'scripts/check_sources.py'
      - 'scripts/daily_feed.py'
      - 'scripts/data_source.py'
      - 'scripts/data_venetian.py'
      - 'scripts/data_venues.py'
      - 'scripts/data_hotels.py'
      - 'site/data.json'
  schedule:
    # 12:10 UTC = 04:10 PST / 05:10 PDT, the morning pull. Re-reads every official URL
    # and captures each room's daily schedule. GitHub Actions cron is UTC-only.
    - cron: "10 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # A change to this file itself gives the job a real run through the normal
      # push path, so site/checks.json and site/feed/ exist and are exercised
      # immediately instead of waiting for the cron. GitHub runs the *new*
      # version of a workflow whose own file changes in the push. The Actions
      # token available to a session cannot dispatch a workflow (HTTP 403), so
      # this path trigger is the only way a session can prove the job runs.
      - '.github/workflows/checks.yml'
      - 'scripts/check_sources.py'
      - 'scripts/daily_feed.py'
      - 'scripts/verify_transcription.py'

permissions:
  contents: write

concurrency:
  group: scheduled-source-review
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Re-check every official URL behind the dashboard
        # Writes site/checks.json itself, including URLs it could not reach, so the
        # record exists even on a bad network day. A changed hash is a review signal,
        # never an automatic value change.
        run: python3 scripts/check_sources.py

      - name: Re-check the transcribed series-PDF rows against the published data
        run: python3 scripts/verify_transcription.py

      - name: Fetch the morning daily schedule feed for each Strip poker room
        continue-on-error: true
        run: python3 scripts/daily_feed.py

      - name: Verify the dashboard still passes its own checks
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/verify_site.py
          python3 -m unittest discover -s tests -p 'test_*.py'
          node --check site/assets/app.js
          python3 -m json.tool site/data.json > /dev/null
          python3 -m json.tool site/checks.json > /dev/null
          if [ -f site/feed/index.json ]; then python3 -m json.tool site/feed/index.json > /dev/null; fi

      - name: Record the check results on the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/checks.json site/feed 2>/dev/null || git add site/checks.json
          if git diff --cached --quiet; then
            echo "No change in the checked sources; nothing to publish."
            exit 0
          fi
          git commit -m "chore: record official source re-check and daily room feed ($(date -u +%F))"

      - name: Push to main, rebasing if another commit landed first
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          echo "::error::could not publish the source check record after 5 attempts"
          exit 1
