name: Verify static research site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate official-source data and local links
        run: python3 scripts/verify_site.py
      - name: Independent re-derivation of every published number
        # Re-derives the arithmetic straight from site/data.json and the verbatim
        # official copies in raw/, without importing the builder, so a defect in
        # the builder cannot hide itself from this check.
        run: python3 scripts/audit_951cd431.py
      - name: Cross-check canonical rows against the official captures
        run: |
          python3 scripts/verify_live_official.py
          python3 scripts/audit_data.py
      - name: Confirm no label claims more than the source text under it
        # F75, F76 and F86 were all the same defect: a row's status reading stronger than the
        # excerpt quoted beneath it. This check compares each label with its own text and with
        # the official capture that text came from, and fails when a total moves silently.
        run: python3 scripts/verify_entry_labels.py
      - name: Validate the canonical dashboard
        run: |
          python3 tests/canonical_smoke.py
          node --check site/assets/app.js
          node --check site/assets/venue.js
          node --check tests/canonical_render.js
          node --check tests/walk_limit_render.js
          node tests/walk_limit_render.js
          node --check tests/sheet_recheck_render.js
          node tests/sheet_recheck_render.js
          node --check tests/test_calculator_missing_inputs_render.js
          node tests/test_calculator_missing_inputs_render.js
          python3 -m json.tool site/data.json > /dev/null
      - name: Install workflow test dependency
        run: python3 -m pip install --quiet pyyaml
      - name: Assert the corrected numbers and their arithmetic
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Assert every workflow file parses with no duplicate keys
        # A duplicate key makes GitHub reject the whole workflow with zero jobs and no
        # log, which is how the scheduled re-check stayed dormant (flag F30).
        run: |
          python3 -m unittest tests.test_workflows -v

      - name: Validate Poker3 companion dashboard
        run: |
          python3 tests/smoke.py
          node --check site/poker3/assets/app.js
          python3 -m json.tool site/poker3/data/research.json > /dev/null
      - name: Confirm the data build is reproducible
        run: |
          python3 scripts/data_source.py
          git diff --exit-code -- site/data.json
