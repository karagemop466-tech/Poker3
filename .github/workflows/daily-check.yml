name: Daily official-source re-check

on:
  schedule:
    - cron: "5 12 * * *"   # 12:05 UTC ≈ 4:05 AM Las Vegas, every morning
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Re-check every official URL, store dated snapshots, mark changed sources
        run: python3 scripts/daily_check.py
      - name: Rebuild site with updated change badges
        run: python3 scripts/build_site.py
      - name: Validate before publishing
        run: python3 scripts/verify_site.py
      - name: Commit snapshots and badges
        run: |
          git config user.name "daily-check[bot]"
          git config user.email "daily-check[bot]@users.noreply.github.com"
          git add snapshots site
          git diff --cached --quiet || git commit -m "chore: daily source re-check $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
