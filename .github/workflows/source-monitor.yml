name: Daily official-source monitor and site refresh

on:
  schedule:
    # Morning in Las Vegas; UTC follows seasonal clock changes.
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # This monitor is for the archived poker3 companion only. A change to
      # checks.yml cannot trigger *this* workflow into running the consolidated
      # re-check — path filters select which runs of THIS file happen, not runs
      # of another file. checks.yml therefore carries the same path on itself;
      # the line below is kept only so companion-related workflow edits still
      # get a monitor pass.
      - '.github/workflows/checks.yml'
      - 'site/poker3/data/research.json'
      - 'scripts/check_sources_poker3.py'
      - '.github/workflows/source-monitor.yml'

permissions:
  contents: write

concurrency:
  # Serialised with the main source re-check so the two jobs never race on main.
  group: scheduled-source-review
  cancel-in-progress: false

jobs:
  check-and-build:
    if: github.repository == 'karagemop466-tech/Poker3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use local main branch for the daily log commit
        run: git checkout -B main origin/main
      - name: Verify monitor and site data
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/smoke.py
          node --check site/poker3/assets/app.js
          python3 -m json.tool site/poker3/data/research.json > /dev/null
      - name: Re-check official source pages
        run: python3 scripts/check_sources_poker3.py
      - name: Record check results on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/poker3/data/source-monitor.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record daily official source check"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

