<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vegas Poker Planner — moving to The executive summary</title>
<!--
  This root-level page is a redirect, not content.

  It was a 2026-11-16 template whose tables were intentionally blank ("Nightly room
  rate ... unverified"). The canonical dashboard in site/ now publishes The executive summary
  with a source link on every row, and it is served at /Poker3/site/.

  The repository's Pages source is still the legacy "deploy from a branch: main /"
  setting, so GitHub publishes the whole repository root after every push and these
  stale templates were reachable at the root URL, contradicting the dashboard at the
  same host. Redirecting removes that possibility whichever publisher wins the race
  (flag F29). Nothing is lost: the old page is in version control and the canonical
  page is the successor.
-->
<link rel="canonical" href="site/index.html">
<meta http-equiv="refresh" content="0; url=site/index.html">
<style>
  :root{color-scheme:dark light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e6edf3;
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:24px}
  main{max-width:34rem;text-align:center}
  h1{font-size:1.25rem;margin:0 0 .5rem;font-weight:650}
  p{margin:.5rem 0;color:#9aa7b4}
  a{color:#6ea8fe}
  .note{font-size:.85rem;margin-top:1.5rem;color:#7d8896}
</style>
</head>
<body>
<main>
  <h1>Opening The executive summary</h1>
  <p>The current page is loading. If nothing happens,
     <a href="site/index.html">open The executive summary</a>.</p>
  <p class="note">Every value there links the official venue page it was read from.
     Blank cells are values no official source published, and they are listed on the
     Flagged for review page.</p>
</main>
<script>location.replace('site/index.html' + location.hash);</script>
</body>
</html>
